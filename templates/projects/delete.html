{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'dashboard/dashboard.css' %}">
{% endblock %}

{% block content %}
<section class="dash">
  <div class="container" style="max-width: 540px;">
    <a href="{% url 'dashboard' %}" class="link-accent" style="display:inline-flex;align-items:center;gap:6px;margin-bottom:20px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
      Volver al dashboard
    </a>
    <div class="panel" style="text-align:center;">
      <div style="margin-bottom:18px;color:#f87171;">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </div>
      <h2 style="margin:0 0 10px;font-size:1.3rem;">Eliminar proyecto</h2>
      <p style="color:#C9D4E3;margin:0 0 24px;">
        ¿Estás seguro de que deseas eliminar <strong style="color:#F0F1F2;">{{ project.title }}</strong>? Esta acción no se puede deshacer.
      </p>
      <form method="post">
        {% csrf_token %}
        <div style="display:flex;gap:10px;justify-content:center;">
          <button type="submit" class="btn-sm" style="background:rgba(248,113,113,0.15);color:#f87171;border:1px solid rgba(248,113,113,0.3);border-radius:12px;font-weight:700;cursor:pointer;">Eliminar</button>
          <a href="{% url 'dashboard' %}" class="btn-ghost btn-sm">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
