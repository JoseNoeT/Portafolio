{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'dashboard/dashboard.css' %}">
{% endblock %}

{% block content %}
<section class="dash">
  <div class="container" style="max-width: 720px;">
    <a href="{% url 'dashboard' %}" class="link-accent" style="display:inline-flex;align-items:center;gap:6px;margin-bottom:20px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
      Volver al dashboard
    </a>
    <div class="panel">
      <div class="panel-head">
        <h2>Editar proyecto</h2>
      </div>
      {% if project.image %}
      <div style="margin-bottom:16px;">
        <img src="{{ project.image.url }}" alt="" style="width:100%;max-height:200px;object-fit:cover;border-radius:14px;">
      </div>
      {% endif %}
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <div style="display:flex;gap:10px;margin-top:18px;">
          <button class="btn-primary btn-sm" type="submit">Actualizar</button>
          <a href="{% url 'dashboard' %}" class="btn-ghost btn-sm">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
