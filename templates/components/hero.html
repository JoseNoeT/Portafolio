{% load static %}
{% if hero_class %}<link rel="stylesheet" href="{% static 'css/components/hero-page/10-image-backgrounds.css' %}?v=4">{% endif %}
<section class="hero hero-page hero--enhanced{% if hero_class %} hero--jmnt-background {{ hero_class }}{% endif %}" role="banner" aria-label="{{ title|default:'Hero de página' }}">
    <div class="hero-page__overlay" aria-hidden="true"></div>

    <div class="hero-page__panel">
        {% if eyebrow %}
            <span class="hero-page__eyebrow">{{ eyebrow }}</span>
        {% endif %}

        <h1 class="hero-page__title">{{ title }}</h1>

        {% if subtitle %}
            <p class="hero-page__subtitle">{{ subtitle }}</p>
        {% endif %}
    </div>
</section>
