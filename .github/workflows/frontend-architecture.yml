name: Frontend architecture

on:
  pull_request:
  push:
    branches: [main, mejoras-portafolio]
  workflow_dispatch:

jobs:
  css-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_frontend_sizes.py --scope css --strict

  css-ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_css_ownership.py
